<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chụp ảnh + Ghi chú</title>
<style>
  :root{
    --bg:#0b0b0c;
    --panel:#161618;
    --panel2:#1f1f22;
    --text:#eee;
    --muted:#9a9a9f;
    --border:#2c2c30;

    --purple:#7A2E77;
    --purple-dark:#4c1c4a;
    --teal:#1B6684;
    --teal-dark:#0f3d50;
    --green:#8DC63F;
    --green-dark:#5c8a24;

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100dvh;
    width:100vw;
    padding-top:var(--safe-t);
    padding-bottom:var(--safe-b);
    padding-left:var(--safe-l);
    padding-right:var(--safe-r);
  }

  /* ---------- CAMERA ---------- */
  #camWrap{
    position:relative;
    flex:0 0 80%;
    height:80%;
    background:#000;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #camWrap video{display:none;}
  #stage{
    width:100%;
    height:100%;
    display:block;
  }
  #camStatus{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    color:var(--muted);
    font-size:14px;
    text-align:center;
    padding:0 20px;
    z-index:2;
  }
  #switchBtn{
    position:absolute;
    top:12px;right:12px;
    width:42px;height:42px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    color:#fff;
    z-index:5;
  }

  /* ---------- PANEL (input) ---------- */
  #panel{
    flex:0 0 20%;
    height:20%;
    min-height:150px;
    background:var(--panel);
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8px 12px;
    gap:6px;
  }
  .row{ display:flex; gap:8px; }

  .field{
    flex:1;
    min-width:0;
    border:none;
    border-radius:8px;
    color:#fff;
    font-size:14px;
    font-weight:700;
    padding:10px 12px;
    outline:none;
    width:100%;
    text-decoration:underline;
    text-decoration-color:rgba(255,255,255,.55);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.35);
  }
  .field::placeholder{ color:rgba(255,255,255,.85); font-weight:700; }
  .field-project{ background:var(--purple); }
  .field-category{ background:var(--teal); }
  .field-progress{ background:var(--green); }

  #captureRow{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:2px;
  }
  #captureBtn{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--teal);
    border:3px solid var(--teal-dark);
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  #captureBtn:active{ filter:brightness(1.15); }
  .captureWrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  #captureLabel{
    font-size:12px;
    font-weight:700;
    color:#fff;
    letter-spacing:.2px;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
    white-space:nowrap;
  }

  /* ---------- LANDSCAPE LAYOUT ---------- */
  @media (orientation: landscape){
    #app{ flex-direction:row; }
    #camWrap{
      flex:0 0 60%;
      height:100%;
      width:60%;
    }
    #panel{
      flex:1;
      height:100%;
      min-height:0;
      border-top:none;
      border-left:1px solid var(--border);
      flex-direction:column;
      justify-content:center;
      align-items:stretch;
      padding:16px 18px;
      gap:14px;
    }
    .row{ flex-direction:column; }
    .field{
      font-size:15px;
      padding:13px 16px;
    }
    #captureRow{
      justify-content:flex-end;
      padding-right:6%;
      margin-top:10px;
    }
    .captureWrap{
      flex-direction:row;
      gap:10px;
    }
    #captureBtn{
      width:64px;height:64px;
    }
  }

  #toast{
    position:fixed;
    bottom:calc(20% + 14px);
    left:50%;
    transform:translateX(-50%);
    background:rgba(20,20,20,.92);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    white-space:nowrap;
  }
  #toast.show{opacity:1;}
  @media (orientation: landscape){
    #toast{ bottom:16px; }
  }
  #flash{
    position:fixed;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:40;
  }
  #flash.on{
    opacity:.85;
    transition:opacity .35s ease;
  }
</style>
</head>
<body>
<div id="app">
  <div id="camWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="stage"></canvas>
    <div id="camStatus">Đang bật camera…</div>
    <button id="switchBtn" title="Đổi camera">⟲</button>
  </div>

  <div id="panel">
    <div class="row">
      <input id="fieldProject" class="field field-project" type="text" placeholder="Tên dự án" maxlength="30" autocomplete="off">
    </div>
    <div class="row">
      <input id="fieldCategory" class="field field-category" type="text" placeholder="Hạng mục" maxlength="30" autocomplete="off">
    </div>
    <div class="row">
      <input id="fieldProgress" class="field field-progress" type="text" placeholder="Tiến trình" maxlength="30" autocomplete="off">
    </div>
    <div id="captureRow">
      <div class="captureWrap">
        <button id="captureBtn" title="Chụp"></button>
        <span id="captureLabel">Chụp ảnh</span>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="flash"></div>

<script>
(function(){
  const video = document.getElementById('video');
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const camStatus = document.getElementById('camStatus');
  const switchBtn = document.getElementById('switchBtn');
  const captureBtn = document.getElementById('captureBtn');
  const toastEl = document.getElementById('toast');
  const flashEl = document.getElementById('flash');

  // Tên dự án -> dòng trên-trái (vàng)
  // Tiến trình -> dòng dưới-trái (đỏ)
  // Hạng mục -> góc dưới-phải (vàng)
  const fieldProject = document.getElementById('fieldProject');
  const fieldProgress = document.getElementById('fieldProgress');
  const fieldCategory = document.getElementById('fieldCategory');

  let stream = null;
  let rafId = null;
  let vw = 0, vh = 0;
  let videoDevices = [];
  let currentDeviceIndex = -1;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function showToast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), ms || 1800);
  }

  // Tính vùng crop từ nguồn (video) để lấp đầy khung đích mà KHÔNG méo hình
  // (thay thế cho CSS object-fit:cover, vì Safari không áp dụng được trên <canvas>)
  function computeCoverCrop(srcW, srcH, dstW, dstH){
    const srcRatio = srcW / srcH;
    const dstRatio = dstW / dstH;
    let sx, sy, sw, sh;
    if(srcRatio > dstRatio){
      sh = srcH;
      sw = srcH * dstRatio;
      sx = (srcW - sw) / 2;
      sy = 0;
    } else {
      sw = srcW;
      sh = srcW / dstRatio;
      sx = 0;
      sy = (srcH - sh) / 2;
    }
    return { sx, sy, sw, sh };
  }

  async function refreshDeviceList(){
    try{
      const all = await navigator.mediaDevices.enumerateDevices();
      videoDevices = all.filter(d => d.kind === 'videoinput');
    }catch(e){ videoDevices = []; }
  }

  // Ưu tiên camera sau "chính" (Back Camera), loại các ống kính phụ như Ultra Wide / Telephoto nếu có nhiều lựa chọn
  function pickMainRearDeviceId(){
    if(!videoDevices.length) return null;
    const backs = videoDevices.filter(d => /back|rear|environment|sau/i.test(d.label));
    const mainBack = backs.find(d => !/ultra|wide|tele|depth|macro/i.test(d.label));
    if(mainBack) return mainBack.deviceId;
    if(backs.length) return backs[0].deviceId;
    // Không có nhãn (chưa cấp quyền lần đầu) -> để trình duyệt tự chọn qua facingMode
    return null;
  }

  async function openStream(constraintsVideo){
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    stream = await navigator.mediaDevices.getUserMedia({ video: constraintsVideo, audio: false });
    video.srcObject = stream;
    await video.play();
    vw = video.videoWidth || 1280;
    vh = video.videoHeight || 720;

    // Cập nhật lại chỉ số camera hiện tại dựa trên deviceId thực tế đang dùng
    const track = stream.getVideoTracks()[0];
    const settings = track.getSettings ? track.getSettings() : {};
    if(settings.deviceId){
      const idx = videoDevices.findIndex(d => d.deviceId === settings.deviceId);
      if(idx >= 0) currentDeviceIndex = idx;
    }
  }

  async function startCamera(deviceId){
    camStatus.style.display = 'block';
    camStatus.textContent = 'Đang bật camera…';
    try{
      const idealVideo = { width:{ideal:1920}, height:{ideal:1080} };

      if(deviceId){
        await openStream({ deviceId: { exact: deviceId }, ...idealVideo });
      } else {
        // Lần đầu: xin quyền bằng facingMode để lấy nhãn thiết bị, sau đó khoá đúng camera chính
        await openStream({ facingMode: { ideal: 'environment' }, ...idealVideo });
        await refreshDeviceList();
        const mainId = pickMainRearDeviceId();
        if(mainId){
          try{ await openStream({ deviceId: { exact: mainId }, ...idealVideo }); }
          catch(e){ /* giữ nguyên stream hiện tại nếu không mở lại được */ }
        }
      }

      if(!videoDevices.length) await refreshDeviceList();
      camStatus.style.display = 'none';
      resizeCanvas();
      if(!rafId) loop();
    }catch(err){
      try{
        // Phương án cuối: mở camera bất kỳ, không ràng buộc
        await openStream(true);
        await refreshDeviceList();
        camStatus.style.display = 'none';
        resizeCanvas();
        if(!rafId) loop();
      }catch(err2){
        camStatus.textContent = 'Không truy cập được camera. Vui lòng cho phép quyền camera trong trình duyệt.';
        console.error(err, err2);
      }
    }
  }

  function switchCamera(){
    if(videoDevices.length < 2){
      showToast('Thiết bị chỉ có 1 camera');
      return;
    }
    currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
    const dev = videoDevices[currentDeviceIndex];
    startCamera(dev.deviceId).then(()=>{
      showToast(dev.label || 'Đã đổi camera');
    });
  }

  function resizeCanvas(){
    const wrap = document.getElementById('camWrap');
    const rect = wrap.getBoundingClientRect();
    if(rect.width < 2 || rect.height < 2) return; // bỏ qua khi layout chưa ổn định
    const targetW = Math.max(1, Math.round(rect.width * dpr));
    const targetH = Math.max(1, Math.round(rect.height * dpr));
    if(stage.width === targetW && stage.height === targetH) return;
    stage.style.width = rect.width + 'px';
    stage.style.height = rect.height + 'px';
    stage.width = targetW;
    stage.height = targetH;
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', ()=>{
    // Xoay máy làm layout đổi qua nhiều bước (thanh địa chỉ ẩn/hiện...),
    // nên tính lại nhiều lần trong lúc chuyển động để tránh hở viền đen.
    resizeCanvas();
    [50, 150, 300, 500, 800].forEach(ms => setTimeout(resizeCanvas, ms));
  });

  // ResizeObserver theo dõi đúng kích thước thực tế của khung camera,
  // đáng tin cậy hơn window 'resize' khi xoay máy / đổi chế độ chia màn hình.
  if('ResizeObserver' in window){
    const ro = new ResizeObserver(()=> resizeCanvas());
    ro.observe(document.getElementById('camWrap'));
  }
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resizeCanvas(); });
  window.addEventListener('pageshow', resizeCanvas);

  function drawOverlayText(context, w, h){
    const tProject = fieldProject.value.trim();
    const tProgress = fieldProgress.value.trim();
    const tCategory = fieldCategory.value.trim();

    const baseSize = Math.round(w * 0.045);
    context.textBaseline = 'alphabetic';
    context.lineJoin = 'round';

    function drawLine(text, x, y, size, color, align){
      if(!text) return;
      context.font = `900 ${size}px Arial, sans-serif`;
      context.textAlign = align;
      context.lineWidth = Math.max(2, size * 0.11);
      context.strokeStyle = '#000000';
      context.fillStyle = color;
      context.strokeText(text, x, y);
      context.fillText(text, x, y);
    }

    // Góc dưới trái: Tên dự án (vàng) phía trên, Tiến trình (đỏ) phía dưới
    const leftX = w * 0.035;
    const line2Y = h * 0.955;
    const line1Y = line2Y - baseSize * 1.35;
    drawLine(tProject, leftX, line1Y, baseSize, '#ffd400', 'left');
    drawLine(tProgress, leftX, line2Y, baseSize, '#ff2d1f', 'left');

    // Góc dưới phải: Hạng mục (vàng)
    const rightX = w * 0.965;
    const line3Y = h * 0.955;
    drawLine(tCategory, rightX, line3Y, baseSize, '#ffd400', 'right');
  }

  function loop(){
    if(video.readyState >= 2 && vw && vh && stage.width && stage.height){
      const crop = computeCoverCrop(vw, vh, stage.width, stage.height);
      ctx.drawImage(video, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, stage.width, stage.height);
      drawOverlayText(ctx, stage.width, stage.height);
    }
    rafId = requestAnimationFrame(loop);
  }

  function triggerDownload(dataUrl){
    const a = document.createElement('a');
    const ts = new Date();
    const pad = n => String(n).padStart(2,'0');
    const name = `anh_${ts.getFullYear()}${pad(ts.getMonth()+1)}${pad(ts.getDate())}_${pad(ts.getHours())}${pad(ts.getMinutes())}${pad(ts.getSeconds())}.jpg`;
    a.href = dataUrl;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function capture(){
    if(!vw || !vh || !stage.width || !stage.height){ showToast('Camera chưa sẵn sàng'); return; }
    flashEl.classList.add('on');
    setTimeout(()=> flashEl.classList.remove('on'), 180);

    // Crop đúng khung hình người dùng đang thấy trên preview (cùng tỉ lệ), giữ độ phân giải gốc của camera
    const crop = computeCoverCrop(vw, vh, stage.width, stage.height);
    const out = document.createElement('canvas');
    out.width = Math.round(crop.sw);
    out.height = Math.round(crop.sh);
    const octx = out.getContext('2d');
    octx.drawImage(video, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, out.width, out.height);
    drawOverlayText(octx, out.width, out.height);

    const dataUrl = out.toDataURL('image/jpeg', 0.95);
    triggerDownload(dataUrl);
    showToast('Đã lưu ảnh về máy ✓');
  }

  captureBtn.addEventListener('click', capture);
  switchBtn.addEventListener('click', switchCamera);

  startCamera();
})();
</script>
</body>
</html>
